name: Snapshot Build

on:
  push:
    branches:
      - snapshot

# Workflow-level ceiling for the called reusables. The credential-scoped release
# and container steps get their secrets via `secrets: inherit` below (verify
# never sees them); packages: write is needed for the GHCR image push.
permissions:
  contents: read
  packages: write

concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
    with:
      # The deliverable is a Java 21 docker image; no need for a JDK matrix.
      java-versions: '["21"]'

  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
    with:
      do-release: false
      # bnd resolve/export tasks are not parallel-safe in this workspace.
      gradle-parallel: false
      # Re-resolve and export the runtime jar in the SAME build that publishes
      # to Maven, and hand it to the container job as the release-jars artifact.
      extra-gradle-tasks: >-
        org.eclipse.fennec.data.atlas.runtime:resolve.dataatlas.runtime_base
        org.eclipse.fennec.data.atlas.runtime:export.dataatlas.runtime_docker
        org.eclipse.fennec.data.atlas.runtime:export.dataatlas.runtime_docker_atlas
      artifact-paths: |
        org.eclipse.fennec.data.atlas.runtime/generated/distributions/executable/dataatlas.runtime_docker.jar
        org.eclipse.fennec.data.atlas.runtime/generated/distributions/executable/dataatlas.runtime_docker_atlas.jar
        org.eclipse.fennec.data.atlas.runtime/generated/org.eclipse.fennec.data.atlas.runtime.jar
    secrets: inherit

  # The images are built from the release-jars artifact of the release job
  # above, so the jars they embed are the jars published to Maven in that same
  # Gradle invocation. Tagging follows the model.atlas scheme: file-snapshot /
  # atlas-snapshot plus the Bundle-Version pair (eclipse-fennec/.github,
  # docs/ci-cd-reusable-workflows.md §5.7).
  container-file:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-container.yml@074409595cdb7f4afc3c3ab521fe720b05f913b3 # eclipse-fennec/.github#43
    with:
      image-name: data.atlas
      docker-label: snapshot
      variant: file
      docker-context: docker/dataatlas
      # No runtime-jar-target: the Dockerfile COPYs this variant's jar name.
      runtime-jar: dataatlas.runtime_docker.jar
      runtime-dir: org.eclipse.fennec.data.atlas.runtime/runtime
      version-jar: org.eclipse.fennec.data.atlas.runtime.jar
    secrets: inherit

  container-atlas:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-container.yml@074409595cdb7f4afc3c3ab521fe720b05f913b3 # eclipse-fennec/.github#43
    with:
      image-name: data.atlas
      docker-label: snapshot
      variant: atlas
      docker-context: docker/dataatlas-atlas
      # No runtime-jar-target: the Dockerfile COPYs this variant's jar name.
      runtime-jar: dataatlas.runtime_docker_atlas.jar
      runtime-dir: org.eclipse.fennec.data.atlas.runtime/runtime
      version-jar: org.eclipse.fennec.data.atlas.runtime.jar
    secrets: inherit
